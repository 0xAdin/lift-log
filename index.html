<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Each of the four days wears a bumper-plate color (red, blue, yellow, green); everything else stays steel grey. */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#f4f6f8; --ink:#16202b; --muted:#566371; --line:#d3d9df;
  --accent:#1f4f8f; --accent-ink:#ffffff;
  --plate1:#c2352b; --plate2:#2b5ea7; --plate3:#e0aa12; --plate4:#23794d; --plate-ink:#ffffff; --plate3-ink:#2a2000;
  --good:#1b7446; --good-bg:#e1f2e8; --warn:#8f5600; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe5e3;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --surface:#19212a; --sunk:#141b22; --ink:#e7ecf1; --muted:#95a2af; --line:#2b3642;
    --accent:#86b4ef; --accent-ink:#0c1620;
    --plate1:#e0574c; --plate2:#5b8fdb; --plate3:#b88a17; --plate4:#35a08c; --plate-ink:#0c1116; --plate3-ink:#0c1116;
    --good:#62c890; --good-bg:#15301f; --warn:#e8a94a; --warn-bg:#33270f; --bad:#f08a81; --bad-bg:#3a1a17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --sunk:#141b22; --ink:#e7ecf1; --muted:#95a2af; --line:#2b3642;
  --accent:#86b4ef; --accent-ink:#0c1620;
  --plate1:#e0574c; --plate2:#5b8fdb; --plate3:#b88a17; --plate4:#35a08c; --plate-ink:#0c1116; --plate3-ink:#0c1116;
  --good:#62c890; --good-bg:#15301f; --warn:#e8a94a; --warn-bg:#33270f; --bad:#f08a81; --bad-bg:#3a1a17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.status{font-size:13px;color:var(--muted)}
.status.bad{color:var(--bad)}
nav.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead small{color:var(--muted);font-size:13px;text-align:right}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:6px solid var(--pc)}
.pick .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pick .n{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;text-transform:uppercase}
.pick[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--pi)}
.pick[aria-pressed="true"] .d{color:var(--pi);opacity:.85}
.pick:disabled{opacity:.45;cursor:not-allowed}
.s1{--pc:var(--plate1);--pi:var(--plate-ink)} .s2{--pc:var(--plate2);--pi:var(--plate-ink)} .s3{--pc:var(--plate3);--pi:var(--plate3-ink)} .s4{--pc:var(--plate4);--pi:var(--plate-ink)} .s0{--pc:var(--muted);--pi:var(--surface)}

.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
button.pill{min-height:34px}
button.pill[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.on{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--accent))}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row.sub{padding-top:0;border-top:0;margin-top:-4px}
.check{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--sunk);display:grid;place-items:center;padding:0}
.check svg{width:24px;height:24px;stroke-width:3;fill:none;opacity:0;stroke:var(--surface)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"] svg{opacity:1}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.title b{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.title span{color:var(--muted);font-size:14px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.row.done .title b{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.hint.up{color:var(--good)} .hint.down{color:var(--warn)}
.wt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:20px;line-height:1;padding:0}
.wt input{width:86px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;padding:0 4px}
.wt .unit{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:14px;font-weight:500;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-v="easy"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.seg button[aria-pressed="true"][data-v="hard"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.toggle{align-self:flex-start;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:14px;padding:4px 10px;text-align:left}
.toggle[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.rowtools{display:flex;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px 0;font-size:13px;color:var(--accent);text-decoration:underline}
.locked{opacity:.45;pointer-events:none}
.note{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.note.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;text-align:left}
.chip small{color:var(--muted)}
.chip.rec{border-style:solid;border-color:var(--accent)}
.btn{min-height:50px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.05em;text-transform:uppercase;padding:0 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:42px;font-size:17px}
.btn.danger{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form input[type=text]{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;width:100%}
.form label.ck{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px}
.form .btn,.form .seg{grid-column:1/-1}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.plain li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
ul.plain li span:last-child{color:var(--muted);text-align:right;flex:none;max-width:55%}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.loghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.loghead b{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.trend{display:flex;flex-direction:column;gap:6px}
.trend svg{width:100%;height:64px;display:block}
.trendhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trendhead b{font-family:var(--display);font-size:24px;font-weight:600}
.loading main{pointer-events:none;opacity:.6}
@media (prefers-reduced-motion:no-preference){.check,.seg button,.toggle{transition:background-color .12s,border-color .12s}}
/* phone-first shell: tabs at the thumb, rest timer above them */
header.top{padding-top:calc(18px + env(safe-area-inset-top))}
.wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:10;max-width:560px;margin:0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);gap:6px}
nav.tabs a{font-size:17px;padding:11px 0}
#rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:9;max-width:560px;margin:0 auto;padding:0 12px}
#rest[hidden]{display:none}
#rest .in{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 14px}
#rest .t{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:74px}
#rest .l{flex:1;font-size:13px;opacity:.8}
#rest button{height:38px;border-radius:8px;border:1px solid var(--bg);background:transparent;color:var(--bg);padding:0 12px;font-size:14px}
#rest.over .in{background:var(--good);color:var(--surface)}
.check{width:48px;height:48px;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink)}
.row{grid-template-columns:48px 1fr}
.check.part{border-color:var(--accent);color:var(--accent)}
.daytitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.daytitle b{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;line-height:1}
details.menu{border-top:1px solid var(--line);padding-top:10px}
details.menu summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0}
details.menu .in{display:flex;flex-direction:column;gap:10px;padding-top:8px}
/* progress page */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile b small{font-size:18px;font-weight:600;color:var(--muted)}
.tile span{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:18px repeat(12,1fr);gap:3px;align-items:center}
.cal .lab{font-size:10px;color:var(--muted)}
.cal .c{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600;position:relative;min-width:0}
.cal .c.lift{background:var(--pc);border-color:var(--pc);color:var(--pi)}
.cal .c.cardio{border:2px solid var(--muted)}
.cal .c.today{outline:2px solid var(--ink);outline-offset:1px}
.cal .c .dotc{position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--pi);border:1px solid var(--pc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--pc);display:inline-block}
.sw.hollow{background:transparent;border:2px solid var(--muted)}
.wk{position:relative;display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.wk .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.wk .b i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--accent)}
.wk .b em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .target{position:absolute;left:0;right:0;border-top:1px dashed var(--muted)}
.wk .target span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--muted);background:var(--surface);padding-left:4px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.liftcard{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.liftcard:first-of-type{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
textarea.bk{width:100%;min-height:70px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:12px/1.3 ui-monospace,Menlo,monospace;padding:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top"><h1>Lift Log</h1><span class="status" id="status" role="status">Loading your log…</span></header>
  <main id="main"></main>
</div>
<div id="rest" hidden><div class="in"><span class="t" id="restT">0:00</span><span class="l" id="restL"></span><button type="button" data-r="add">+30s</button><button type="button" data-r="skip">Skip</button></div></div>
<nav class="tabs" aria-label="Sections">
  <a href="#today" data-tab="today">Today</a>
  <a href="#progress" data-tab="progress">Progress</a>
  <a href="#history" data-tab="history">History</a>
  <a href="#plan" data-tab="plan">Plan</a>
</nav>
<script>
/*LOGIC-START*/
const LIFTS = {
  squat: { name: 'Back squat', inc: 5, round: 5 },
  bench: { name: 'Bench press', inc: 2.5, round: 2.5 },
  trap:  { name: 'Trap bar deadlift', inc: 5, round: 5 },
};
const OPEN_BOOK = { key: 'openbook', name: 'Side-lying open book', sets: '10 each side' };
const W = {
  marches: { key: 'marches', name: 'Hip thrust marches', sets: '10 each side' },
  revsitup: { key: 'revsitup', name: 'Reverse hip situps', sets: '10' },
  revnordic: { key: 'revnordic', name: 'Reverse Nordic curls', sets: '8' },
  rockback: { key: 'rockback', name: 'Adductor rock-backs', sets: '8 each side' },
  sideplank: { key: 'sideplank', name: 'Side plank with hip abduction', sets: '30s each side' },
  scap: { key: 'scap', name: 'Scap pullups', sets: '8' },
  pullapart: { key: 'pullapart', name: 'Band pull-aparts', sets: '15' },
  ramp: { key: 'ramp', name: 'Ramp-up sets of the first lift', sets: 'about 5, 3, 2 reps, weight rising' },
};
const JEFF = { key: 'jefferson', type: 'check', name: 'Jefferson curls', n: 3, r: '8, always last' };
const DAYS = {
  1: { id: 1, name: 'Lower A', sub: 'Squat', main: 'squat',
    warm: [OPEN_BOOK, W.marches, W.revsitup, W.revnordic, W.rockback, W.ramp],
    core: [
      { key: 'squat', type: 'main', lift: 'squat', name: 'Back squat', must: true },
      { key: 'squatBack', type: 'backoff', lift: 'squat', of: 'squat', name: 'Back-off set' },
      { key: 'rdl', type: 'range', name: 'RDL', n: 3, r: '6–8', inc: 5, top: 'All sets hit 8', must: true },
      { key: 'suitcaseLunge', type: 'check', name: 'Suitcase lunge to mini squat', n: 3, r: '8 each side', must: true },
      { key: 'abwheel', type: 'reps', name: 'Ab wheel rollout', n: 3, r: '6–10', top: 'All sets hit 10', next: 'reach further out or slow the lowering to 3 seconds', must: true },
      { key: 'boxHinge', type: 'check', name: 'Box hip hinge', n: 3, r: '10 each side' },
      { key: 'backExt', type: 'range', name: 'Back extension', n: 3, r: '10–12', inc: 5, unit: 'lb held', top: 'All sets hit 12' },
      JEFF,
    ], rec: ['calfStanding', 'hamCurl', 'hipThrust'] },
  2: { id: 2, name: 'Upper A', sub: 'Heavy', main: 'bench',
    warm: [OPEN_BOOK, W.sideplank, W.scap, W.pullapart, W.ramp],
    core: [
      { key: 'bench', type: 'main', lift: 'bench', name: 'Bench press', must: true },
      { key: 'benchBack', type: 'backoff', lift: 'bench', of: 'bench', name: 'Back-off set' },
      { key: 'wpullup', type: 'range', name: 'Weighted pullups', n: 4, r: '4–6', inc: 5, unit: 'lb added', top: 'All sets hit 6', must: true },
      { key: 'row', type: 'range', name: 'Barbell row', n: 3, r: '6–8', inc: 5, top: 'All sets hit 8', must: true },
      { key: 'pallof', type: 'range', name: 'Cable Pallof press', n: 3, r: '10 each side', inc: 5, top: 'All sets felt solid', must: true },
      { key: 'ohp', type: 'range', name: 'Overhead press', n: 3, r: '6–8', inc: 2.5, top: 'All sets hit 8' },
      { key: 'facepull', type: 'range', name: 'Face pulls', n: 3, r: '15', inc: 5, top: 'All sets hit 15' },
      { key: 'deadbug', type: 'check', name: 'Dead bug', n: 3, r: '8 each side' },
      JEFF,
    ], rec: ['lateral', 'curl', 'ohTri'] },
  3: { id: 3, name: 'Lower B', sub: 'Hinge and power', main: 'trap',
    warm: [OPEN_BOOK, W.marches, W.revsitup, W.sideplank, W.rockback, W.ramp],
    core: [
      { key: 'boxjump', type: 'check', name: 'Box jumps', n: 4, r: '3, full reset each rep', noReturn: true },

      <li>Squat, bench and trap bar start at 4 × 5. Rate each one easy, solid or hard. Easy or solid adds 5 lb (2.5 on bench) next time.</li>
      <li>Hard twice in a row moves that lift to the wave: 4 × 5, then 4 × 4, then 5 × 3, each 5 lb heavier (2.5 on bench), then a deload. Each new wave starts one step higher.</li>
      <li>Before the wave, every fifth session of a lift is a deload at about 70%.</li>
      <li>Everything else with a number: hit the top of the range on every set, then it goes up.</li>
      <li>The back-off set is one lighter set of 8 after the heavy sets. Warmup sets stay short so you are fresh.</li>
      <li>Short day: the four must-dos count as a full session.</li>
      <li>Runs and swims are optional. One a week keeps the plan well rounded.</li></ul></section>`;
    if (state.custom.length) h += `<section class="card"><h2>Your add-ons</h2><div>${state.custom.map(c =>
      `<div class="field"><span>${esc(c.name)} <span class="muted small">${esc(c.n ? c.n + ' × ' + c.r : c.r)}</span></span><button class="link" data-act="delCustom" data-key="${c.key}">Delete</button></div>`).join('')}</div></section>`;
    h += `<section class="card"><div class="sechead"><h2>Backup</h2><small>${HOSTED ? 'Synced to your Claude account' : 'Your log lives on this device'}</small></div>
      <p class="small muted">${HOSTED ? 'A copy is still worth keeping.' : 'Clearing the browser\'s site data or switching phones would lose it, so copy a backup now and then and paste it somewhere safe, like Notes.'}</p>
      <button class="btn ghost" data-act="copyBackup">Copy backup</button>
      ${ui.backup ? `<textarea class="bk" id="bkOut" readonly aria-label="Backup text">${esc(ui.backup)}</textarea><p class="small muted">Couldn't reach the clipboard. Select all of this text and copy it.</p>` : ''}
      <textarea class="bk" id="bkIn" placeholder="Paste a backup here to restore it" aria-label="Paste a backup to restore"></textarea>
      <button class="btn ghost${ui.armed === 'restore' ? ' danger' : ''}" data-act="restore">${ui.armed === 'restore' ? 'Tap again: this replaces everything' : 'Restore from pasted backup'}</button>
      <button class="btn ghost${ui.armed === 'wipe' ? ' danger' : ''}" data-act="wipe">${ui.armed === 'wipe' ? 'Tap again to erase everything' : 'Erase everything and start over'}</button></section>`;
    return h + '</div>';
  }

  /* ---------- history ---------- */
  function renderHistory() {
    let h = `<div class="stack">`;
    if (!history.logs.length) h += `<div class="note">Nothing logged yet. Finish a session on the Today tab and it shows up here.</div>`;
    for (const l of history.logs) {
      const del = `<button class="link" data-act="delLog" data-key="${l.id}" style="align-self:flex-start">${ui.armed === 'log' + l.id ? 'Tap again to delete this entry' : 'Delete entry'}</button>`;
      if (l.kind === 'cardio') { h += `<section class="card s0"><div class="loghead"><span class="dot"></span><b>${esc(niceDate(l.date))}</b><span class="muted">${esc(l.type)}${l.min ? ' · ' + esc(l.min) + ' min' : ''}${l.dist ? ' · ' + esc(l.dist) : ''}</span></div>${del}</section>`; continue; }
      h += `<section class="card s${l.day}"><div class="loghead"><span class="dot"></span><b>${esc(niceDate(l.date))}</b><span class="muted">${esc('Day ' + l.day + ': ' + l.name)}</span>${l.ret ? `<span class="pill">Ramp-up week ${l.ret === 2 ? 2 : 1}</span>` : ''}${l.deload ? '<span class="pill">Deload</span>' : ''}${l.short ? '<span class="pill">Short day</span>' : ''}</div>
        <ul class="plain">${l.items.map(i => `<li><span>${esc(i.n)}</span><span class="num">${esc(i.s)}${i.w != null ? ' · ' + i.w + ' ' + esc(i.u || 'lb') : ''}${i.feel ? ' · ' + i.feel : ''}${i.top ? ' · top' : ''}</span></li>`).join('')}</ul>
        ${!l.short && l.skipped && l.skipped.length ? `<p class="small muted">Skipped: ${esc(l.skipped.join(', '))}</p>` : ''}${del}</section>`; }
    return h + '</div>';
  }
  function render() {
    document.querySelectorAll('nav.tabs a').forEach(a => a.dataset.tab === ui.tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const y = window.scrollY;
    $('#main').innerHTML = ui.tab === 'plan' ? renderPlan() : ui.tab === 'history' ? renderHistory() : ui.tab === 'progress' ? renderProgress() : renderToday();
    window.scrollTo(0, y);
  }
  function route() { const t = (location.hash || '#today').slice(1); ui.tab = ['today', 'progress', 'history', 'plan'].includes(t) ? t : 'today'; ui.armed = ''; ui.backup = ''; }
  window.addEventListener('hashchange', () => { route(); render(); window.scrollTo(0, 0); });

  /* ---------- events ---------- */
  const num = v => { v = String(v).trim().replace(',', '.'); return v === '' || isNaN(Number(v)) ? null : Number(v); };
  const ARMABLE = ['discard', 'ret', 'delLog', 'restore', 'wipe'];
  $('#main').addEventListener('toggle', e => { if (e.target.id === 'menu') ui.menuOpen = e.target.open; }, true);
  $('#main').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, key = b.dataset.key; ui.error = '';
    if (!ARMABLE.includes(act)) ui.armed = '';
    if (act === 'cardioType') { ui.cardio = b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
    if (act === 'pick') { if (hasProgress(state.draft)) return; state.draft = null; ui.day = Number(b.dataset.n); ui.summary = null; ui.warmOpen = false; save(); }
    else if (act === 'deload') { const d = ensureDraft(); d.deload = !d.deload; d.w = {}; d.sets = {}; d.done = {}; save(); }
    else if (act === 'short') { const d = ensureDraft(); d.short = !d.short; save(); }
    else if (act === 'warm') { const d = ensureDraft(); d.warm[key] = !d.warm[key]; keepAwake(); save(); }
    else if (act === 'warmOpen') { ui.warmOpen = true; }
    else if (act === 'skipWarm') { ensureDraft().skipWarm = true; save(); }
    else if (act === 'done') { const d = ensureDraft(); const it = sessionItems(state, d).all.find(i => i.key === key); const n = setsCount(state, it, d);
      if (d.done[key]) { d.done[key] = false; d.sets[key] = 0; }
      else { const c = (d.sets[key] || 0) + 1; d.sets[key] = c; if (c >= n) d.done[key] = true;
        if (state.restOn !== false) { const heavy = it.type === 'main' || it.type === 'backoff'; startRest(heavy ? 180 : 90, it.type === 'backoff' ? 'back-off set' : it.name.toLowerCase()); } }
      keepAwake(); save(); }
    else if (act === 'feel') { const d = ensureDraft(); const it = sessionItems(state, d).all.find(i => i.key === key); d.feel[key] = b.dataset.v; d.done[key] = true; d.sets[key] = setsCount(state, it, d); save(); }
    else if (act === 'top') { const d = ensureDraft(); d.top[key] = !d.top[key]; save(); }
    else if (act === 'step') { const d = ensureDraft(); const it = sessionItems(state, d).all.find(i => i.key === key); const cur = loggedValue(state, d, it);
      d.w[key] = Math.max(0, (cur == null || isNaN(cur) ? 0 : cur) + Number(b.dataset.d)); save(); }
    else if (act === 'addAddon') { const d = ensureDraft(); if (!d.addons.includes(key)) d.addons.push(key); save(); }
    else if (act === 'removeAddon') { const d = ensureDraft(); d.addons = d.addons.filter(k => k !== key); delete d.done[key]; delete d.sets[key]; save(); }
    else if (act === 'pin') { const d = ensureDraft(); const p = state.pins[d.day] || (state.pins[d.day] = []); const i = p.indexOf(key); i >= 0 ? p.splice(i, 1) : p.push(key); save(); }
    else if (act === 'closeSummary') { ui.summary = null; }
    else if (act === 'restOn') { state.restOn = state.restOn === false; if (!state.restOn) ui.rest = null; save(); }
    else if (act === 'discard') { if (ui.armed !== 'discard') ui.armed = 'discard'; else { ui.armed = ''; state.draft = null; ui.rest = null; save(); } }
    else if (act === 'ret') { if (ui.armed !== 'ret') ui.armed = 'ret'; else { ui.armed = ''; const on = state.returnLeft.length || state.ramp2.length; state.returnLeft = on ? [] : [1, 2, 3, 4]; state.ramp2 = on ? [] : [1, 2, 3, 4]; if (!hasProgress(state.draft)) state.draft = null; save(); } }
    else if (act === 'delCustom') { state.custom = state.custom.filter(c => c.key !== key); for (const n of [1, 2, 3, 4]) state.pins[n] = (state.pins[n] || []).filter(k => k !== key); if (state.draft) state.draft.addons = state.draft.addons.filter(k => k !== key); save(); }
    else if (act === 'delLog') { if (ui.armed !== 'log' + key) ui.armed = 'log' + key; else { ui.armed = ''; history.logs = history.logs.filter(l => l.id !== key); save('history'); } }
    else if (act === 'copyBackup') { const text = JSON.stringify({ app: 'liftlog', v: 3, state, history }); ui.backup = '';
      try { navigator.clipboard.writeText(text).then(() => { b.textContent = 'Copied. Paste it somewhere safe.'; }, () => { ui.backup = text; render(); }); } catch (err) { ui.backup = text; }
      if (!ui.backup) return; }
    else if (act === 'restore') { const raw = ($('#bkIn') || {}).value || ''; let j = null; try { j = JSON.parse(raw); } catch (err) {}
      if (!j || j.app !== 'liftlog' || !j.state) { ui.error = 'That doesn\'t look like a Lift Log backup. Paste the whole text you copied.'; ui.armed = ''; render(); const t = $('#bkIn'); if (t) t.value = raw; return; }
      if (ui.armed !== 'restore') { ui.armed = 'restore'; render(); $('#bkIn').value = raw; return; }
      ui.armed = ''; state = normalize(j.state); history = j.history && Array.isArray(j.history.logs) ? j.history : { logs: [] }; ui.day = null; save('history'); }
    else if (act === 'wipe') { if (ui.armed !== 'wipe') ui.armed = 'wipe'; else { ui.armed = ''; state = defaultState(); history = { logs: [] }; ui.day = null; ui.summary = null; ui.rest = null; save('history'); } }
    else if (act === 'finish') { const d = viewDraft(); const items = sessionItems(state, d).all;
      if (!items.some(i => d.done[i.key])) ui.error = 'Finish at least one lift before saving. Tap its box after each set.';
      else { const miss = missingFeel(state, d);
        if (miss.length) ui.error = 'Rate how ' + miss.join(' and ') + ' felt (easy, solid or hard). The progression needs it.';
        else { const r = applySession(state, d); state = r.state; history.logs.unshift(r.entry); history.logs = history.logs.slice(0, 400);
          ui.summary = { day: d.day, notes: r.notes }; ui.day = null; ui.rest = null; ui.warmOpen = false; ui.menuOpen = false;
          try { ui.wl && ui.wl.release(); } catch (err) {}
          save('history'); render(); window.scrollTo(0, 0); return; } } }
    render();
  });
  $('#main').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.w) { const d = ensureDraft(); const n = num(t.value); if (n == null) delete d.w[t.dataset.w]; else d.w[t.dataset.w] = n;
      const p = document.querySelector('[data-plates="' + t.dataset.w + '"]'); if (p) p.textContent = platesPerSide(n); save(); }
    else if (t.dataset.ww) { const L = state.lifts[t.dataset.ww], n = num(t.value); if (L.mode === 'wave') L.base = n == null ? L.base : n; else { L.w = n; L.hard = 0; } save(); }
  });
  $('#main').addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'customForm') {
      const name = $('#cName').value.trim(), sets = $('#cSets').value.trim() || 'Your sets';
      if (!name) { ui.error = 'Give the exercise a name first.'; render(); return; }
      const d = ensureDraft(); const c = { key: 'c_' + Date.now().toString(36), area: 'Yours', name, n: 0, r: sets, type: $('#cWeighted').checked ? 'range' : 'check', inc: 5, top: 'Top reps on every set' };
      state.custom.push(c); d.addons.push(c.key); ui.error = ''; save(); render();
    } else if (e.target.id === 'cardioForm') {
      const min = num($('#cdMin').value), dist = $('#cdDist').value.trim();
      if (min == null && !dist) { ui.error = 'Add the minutes or a distance first.'; render(); return; }
      history.logs.unshift({ id: Date.now().toString(36), kind: 'cardio', date: ymd(now()), type: ui.cardio, min, dist }); ui.error = '';
      ui.summary = { day: 0, notes: [ui.cardio + ' logged for today.'] }; save('history'); render(); window.scrollTo(0, 0);
    }
  });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
</body>
</html>
